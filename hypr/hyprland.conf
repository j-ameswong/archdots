# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-5, 1920x1080@60.00, 0x0, 1
monitor=eDP-1, 3200x2000@165.00, 1920x0, 2

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = fuzzel

#################
### AUTOSTART ###
#################

# Autostart necessary processes
exec-once = pipewire
exec-once = mako # notifications
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprpaper & waybar
exec-once = wl-paste --watch cliphist store
exec-once = nordvpn connect uk
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = fcitx5
exec-once = linux-discord-rich-presence -c ~/.config/linux-discord-rich-presencerc
# exec-once = hyprswitch init --show-title --custom-css ~/.config/hypr/hyprswitch.css

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = EDITOR,nvim

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# NVIDIA specific settings (from your Sway config)
env = WLR_NO_HARDWARE_CURSORS,1
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = MOZ_ENABLE_WAYLAND,1

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_IM_MODULE,fcitx

env = GDK_BACKEND,wayland,x11,*

cursor {
    no_hardware_cursors = true
}

#####################
### LOOK AND FEEL ###
#####################

# Nord Theme colors from your Sway config
$nord0 = rgb(2E3440)
$nord1 = rgb(3B4252)
$nord2 = rgb(434C5E)
$nord3 = rgb(4C566A)
$nord4 = rgb(D7DDE8)
$nord5 = rgb(EEEEEE)
$nord6 = rgb(ECEFF4)
$nord7 = rgb(8FBCBB)
$nord8 = rgb(88C0D0)
$nord9 = rgb(81A1C1)
$nord10 = rgb(5E81AC)
$nord11 = rgb(BF616A)
$nord12 = rgb(D08770)
$nord13 = rgb(EBCB8B)
$nord14 = rgb(A3BE8C)
$nord15 = rgb(B48EAD)
$nordb = rgb(546484)

# Refer to https://wiki.hyprland.org/Configuring/Variables/
general {
    gaps_in = 8
    gaps_out = 3

    border_size = 2
    
    # Using your Nord colors for active/inactive borders
    col.active_border = $nordb
    col.inactive_border = $nord3

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

debug {
    disable_logs = true
    enable_stdout_logs = false
}

decoration {
    rounding = 10

    # Match the opacity from Sway (0.98)
    active_opacity = 0.97
    inactive_opacity = 0.95

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 3, linear, slide
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, quick, slidefade
    # animation = workspacesIn, 1, 1.21, almostLinear, fade
    # animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Enabling smart gaps to match Sway's "smart_gaps on"
dwindle {
    # pseudotile = true
    # preserve_split = true
    # smart_split = true
    # smart_resizing = true
    # no_gaps_when_only = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    font_family = JetBrains Mono Nerd
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # Match your Sway settings
    repeat_delay = 300
    repeat_rate = 35

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        # tap_to_click = true
        middle_button_emulation = true
        drag_lock = true
    }
}

gestures {
    workspace_swipe = false
}

###################
### KEYBINDINGS ###
###################

# Use Super as mainMod to match your Sway config
$mainMod = SUPER

# Matching your Sway key bindings where possible
bind = $mainMod, T, exec, $terminal --class=kitty-tiled 
bind = $mainMod SHIFT, T, exec, $terminal 
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, A, exec, $menu
bind = $mainMod, W, togglesplit,
bind = $mainMod, S, layoutmsg, togglesplit
bind = $mainMod, BACKSPACE, exec, wlogout
bind = $mainMod, V, exec, sh ~/.config/fuzzel/clipboard-fuzzel.sh
bind = $mainMod SHIFT, C, exec, hyprctl reload

# Screenshot tools with Grim to match your Sway config
bind = , Print, exec, grim
bind = $mainMod, Print, exec, grim -g "$(slurp -d)" - | wl-copy

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8

# Scratchpad (similar to Sway's implementation)
bind = $mainMod, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize mode bindings (similar to your Sway resize mode)
bind = $mainMod, R, submap, resize
submap = resize
    bind = , H, resizeactive, -10 0
    bind = , L, resizeactive, 10 0
    bind = , K, resizeactive, 0 -10
    bind = , J, resizeactive, 0 10
    
    bind = , left, resizeactive, -10 0
    bind = , right, resizeactive, 10 0
    bind = , up, resizeactive, 0 -10
    bind = , down, resizeactive, 0 10
    
    bind = , escape, submap, reset
    bind = , Return, submap, reset
submap = reset

# Splitting (similar to Sway's splitting)
bind = $mainMod, B, splitratio, exact 1

# Fullscreen - using F11 like in your Sway config
bind = $mainMod, F11, fullscreen, 0

# Audio control keys from your Sway config
bindel = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness control from your Sway config
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Window rules based on your Sway config floating rules
windowrulev2 = float, class:^(kitty)$
windowrulev2 = float, title:^(Volume Control)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:^(File Operation Progress)$
windowrulev2 = float, title:^(Confirm to replace files)$

# Opacity rules
# windowrule = opacity 0.92, kitty
# windowrule = opacity 0.92, kitty-tiled

