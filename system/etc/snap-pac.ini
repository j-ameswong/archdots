# snap-pac configuration
# see snap-pac(8) for all available options
#
# snap-pac ships its own pacman hooks in /usr/share/libalpm/hooks/
# (05-snap-pac-pre, 10-snap-pac-removal, zz-snap-pac-post). Those are
# package-owned -- this file is the only thing we configure.
#
# Snapshots are taken around every pacman transaction. The `important_*`
# settings below tag the ones worth keeping longest; their retention is
# governed by NUMBER_LIMIT_IMPORTANT in /etc/snapper/configs/root.

[root]
snapshot = True
cleanup_algorithm = number

# Tag full-system upgrades as important -- these are the pre-upgrade
# snapshots we actually want to be able to roll back to.
important_commands = ["pacman -Syu"]

# Kernel upgrades too: this is what 99-secureboot-sign.hook re-signs,
# and what tends to break boot.
important_packages = ["linux", "linux-lts"]
